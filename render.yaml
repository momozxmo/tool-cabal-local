# Render blueprint. Declares the service and the NAMES of required env vars.
# Secret values are never stored here — set them in the Render dashboard.
services:
  - type: web
    name: all-for-cabal-web
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: BROWSER_CONCURRENCY
        value: "1"
      # Secrets — enter each value in the dashboard (sync:false keeps them out of git).
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: AZTEK_SESSION_ENCRYPTION_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
