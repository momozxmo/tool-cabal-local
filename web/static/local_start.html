<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All for Cabal Web</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #090c13;
      color: #f4f6ff;
    }
    main {
      width: min(420px, calc(100% - 48px));
      padding: 32px;
      border: 1px solid #293147;
      border-radius: 18px;
      background: #101522;
      text-align: center;
      box-shadow: 0 20px 60px #0008;
    }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    p { margin: 0; color: #aeb7d0; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>กำลังเปิด All for Cabal Web</h1>
    <p id="status">กำลังตรวจสอบสิทธิ์จาก Launcher…</p>
  </main>
  <script>
    (() => {
      const status = document.getElementById('status');
      const token = location.hash.slice(1);
      history.replaceState(null, '', '/local-start');
      if (!token) {
        status.textContent = 'กรุณาเปิดผ่าน All for Cabal Web Launcher';
        return;
      }
      fetch('/api/local/session', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token}),
      }).then((response) => {
        if (!response.ok) throw new Error('local session rejected');
        location.replace('/');
      }).catch(() => {
        status.textContent = 'กรุณาเปิดผ่าน All for Cabal Web Launcher';
      });
    })();
  </script>
</body>
</html>
