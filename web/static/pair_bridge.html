<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เชื่อมเซสชัน Aztek | All for Cabal</title>
  <style>
    :root{color-scheme:dark;
      --void:#0b0d13;--obsidian:#111420;--raise:#212636;--edge:#272d40;
      --edge-soft:#1e2334;--ink:#e7eaf3;--muted:#868da3;--faint:#5b6076;
      --arc:#6d7cf5;--arc-bright:#8b96ff;--arc-dim:rgba(109,124,245,.15);
      --common:#8b93a6;--rare:#3f8bea;--epic:#b45ef0;--mystic:#2fcabe;--legend:#e0a63c;
      --rail:linear-gradient(90deg,var(--common),var(--rare),var(--epic),var(--mystic),var(--legend));
      --green:#3fc98a;--red:#ef5b67;
      --sans:"Segoe UI","Leelawadee UI","IBM Plex Sans Thai",Tahoma,system-ui,sans-serif;
      --mono:"Cascadia Code","JetBrains Mono","SF Mono",Consolas,monospace;
      /* legacy aliases */
      --bg:var(--void);--panel:var(--obsidian);--line:var(--edge);--text:var(--ink);--blue:var(--arc);--shadow:0 30px 70px -30px #000c}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.55 var(--sans);display:flex;align-items:center;justify-content:center;padding:20px;
      background:
        radial-gradient(900px 560px at 50% -18%,rgba(109,124,245,.15),transparent 60%),
        radial-gradient(640px 460px at 88% 112%,rgba(47,202,190,.06),transparent 55%),
        var(--void)}
    .card{width:min(100%,460px);background:linear-gradient(180deg,var(--obsidian),#0e111b);
      border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;position:relative;
      animation:rise .5s ease}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .card::before{content:"";display:block;height:3px;background:var(--rail)}
    .head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--edge-soft,#1e2334)}
    .gem{width:30px;height:30px;transform:rotate(45deg);border-radius:8px;flex:none;position:relative;
      background:conic-gradient(from 45deg,var(--common),var(--rare),var(--epic),var(--mystic),var(--legend),var(--common));
      box-shadow:0 0 20px -3px var(--arc)}
    .gem::after{content:"";position:absolute;inset:6px;border-radius:4px;background:var(--obsidian)}
    .card h1{font-size:18px;font-weight:800;margin:0;padding:0;border:0;letter-spacing:-.01em}
    .head p{margin:2px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
    .body{padding:20px}
    label{display:grid;gap:7px;margin-bottom:14px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    input{width:100%;background:#0d111a;color:var(--ink);border:1px solid var(--edge);border-radius:9px;padding:11px 12px;font:15px var(--mono)}
    input:focus{outline:none;border-color:var(--arc);box-shadow:0 0 0 3px var(--arc-dim)}
    button{width:100%;margin-top:4px;border:1px solid transparent;border-radius:9px;
      background:linear-gradient(150deg,var(--arc),#5563e6);color:#fff;padding:12px;font:700 15px var(--sans);
      cursor:pointer;box-shadow:0 8px 22px -10px var(--arc);transition:box-shadow .15s,transform .05s}
    button:hover:not(:disabled){box-shadow:0 11px 28px -10px var(--arc)}
    button:active:not(:disabled){transform:translateY(1px)}
    button:focus-visible{outline:2px solid var(--arc-bright);outline-offset:2px}
    button:disabled{opacity:.45;cursor:default;box-shadow:none}
    .msg{min-height:1.4em;margin-top:14px;color:var(--muted);font-size:13.5px}
    .msg.ok{color:var(--green)}.msg.err{color:var(--red)}
    .hint{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.6}
    .cookies{font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--faint);margin-top:12px;
      border-left:2px solid var(--edge);padding-left:10px}
    a{color:var(--arc-bright)}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    @media(max-width:480px){body{padding:12px}.body{padding:16px}}
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="gem"></span>
      <div><h1>เชื่อมเซสชัน Aztek</h1><p>All for Cabal · Pair Bridge</p></div>
    </div>
    <div class="body">
      <p class="hint" id="hint">วางรหัสจับคู่ (pairing token) ที่สร้างจากหน้าบัญชี แล้วกดเชื่อม</p>
      <label for="token">รหัสจับคู่ (ใช้ครั้งเดียว)
        <input id="token" type="text" autocomplete="off" placeholder="วางรหัสที่นี่">
      </label>
      <label for="label">ชื่อบัญชี (ไม่บังคับ)
        <input id="label" type="text" autocomplete="off" placeholder="เช่น บัญชีหลัก">
      </label>
      <button id="connect" type="button">เชื่อมต่อ</button>
      <p id="msg" class="msg" role="status" aria-live="polite"></p>
      <p class="cookies" id="cookieInfo"></p>
    </div>
  </div>
  <script>
    'use strict';
    // The bookmarklet passes the Aztek cookies in the URL fragment (#...), which
    // browsers never send to the server — so the raw session never hits a log.
    const AZTEK_V2_ORIGIN = 'https://aztek-tools-v2.combo-interactive.com';

    function parseFragment() {
      const raw = location.hash.startsWith('#') ? location.hash.slice(1) : location.hash;
      if (!raw) return null;
      try {
        return JSON.parse(decodeURIComponent(escape(atob(raw))));
      } catch (e) {
        return null;
      }
    }

    function sameSite(v) {
      const s = (v || '').toLowerCase();
      if (s === 'strict') return 'Strict';
      if (s === 'none' || s === 'no_restriction') return 'None';
      return 'Lax';
    }

    // Turn "name=value; name2=value2" (document.cookie) into Playwright cookies
    // scoped to the Aztek v2 host. document.cookie omits httpOnly cookies and
    // attributes, so we default the flags the search context needs.
    function toStorageState(payload) {
      const cookies = [];
      (payload.cookies || []).forEach((c) => {
        cookies.push({
          name: c.name,
          value: c.value,
          domain: c.domain || 'aztek-tools-v2.combo-interactive.com',
          path: c.path || '/',
          httpOnly: false,
          secure: true,
          sameSite: sameSite(c.sameSite),
          expires: -1,
        });
      });
      const origins = (payload.localStorage && payload.localStorage.length)
        ? [{ origin: AZTEK_V2_ORIGIN, localStorage: payload.localStorage }]
        : [];
      return { cookies, origins };
    }

    const msg = document.getElementById('msg');
    const cookieInfo = document.getElementById('cookieInfo');
    const connectBtn = document.getElementById('connect');
    const tokenInput = document.getElementById('token');
    const labelInput = document.getElementById('label');

    const captured = parseFragment();
    // Clear the fragment from the address bar immediately so the session is not
    // left sitting in the URL / history.
    if (location.hash) {
      history.replaceState(null, '', location.pathname + location.search);
    }

    let storageState = null;
    if (!captured || !captured.cookies || !captured.cookies.length) {
      cookieInfo.textContent =
        'ยังไม่พบข้อมูลเซสชัน — เปิดหน้านี้ผ่านปุ่ม “เชื่อม Aztek” (bookmarklet) ขณะอยู่บนหน้า Aztek ที่ล็อกอินแล้ว';
      connectBtn.disabled = true;
    } else {
      storageState = toStorageState(captured);
      const names = storageState.cookies.map((c) => c.name);
      const hasToken = names.indexOf('access_token') !== -1;
      cookieInfo.textContent = 'จับเซสชันได้ ' + names.length + ' คุกกี้'
        + (hasToken ? ' (พบ access_token ✓)' : ' — ⚠️ ไม่พบ access_token');
    }

    async function connect() {
      const token = tokenInput.value.trim();
      if (!token) { msg.textContent = 'กรุณาวางรหัสจับคู่ก่อน'; msg.className = 'msg err'; return; }
      if (!storageState) { return; }
      connectBtn.disabled = true;
      msg.textContent = 'กำลังเชื่อมต่อ…'; msg.className = 'msg';
      try {
        const res = await fetch('/api/aztek/pair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pairing_token: token,
            account_label: labelInput.value.trim(),
            storage_state: storageState,
          }),
        });
        if (res.ok) {
          const body = await res.json().catch(() => ({}));
          const label = body && body.account_label ? ' (' + body.account_label + ')' : '';
          msg.textContent = 'เชื่อมต่อสำเร็จ' + label + ' — กลับไปที่หน้าเว็บได้เลย';
          msg.className = 'msg ok';
          tokenInput.value = '';
        } else if (res.status === 404) {
          msg.textContent = 'ไม่พบรหัสจับคู่ — ตรวจสอบว่าคัดลอกครบ'; msg.className = 'msg err';
        } else if (res.status === 410) {
          msg.textContent = 'รหัสหมดอายุหรือถูกใช้แล้ว — สร้างใหม่จากหน้าบัญชี'; msg.className = 'msg err';
        } else if (res.status === 422) {
          const body = await res.json().catch(() => ({}));
          msg.textContent = 'เซสชันไม่ถูกต้อง' + (body.detail ? ' (' + body.detail + ')' : ''); msg.className = 'msg err';
        } else if (res.status === 429) {
          msg.textContent = 'พยายามบ่อยเกินไป — รอสักครู่'; msg.className = 'msg err';
        } else if (res.status === 401) {
          msg.textContent = 'กรุณาล็อกอินเว็บ All for Cabal ก่อน แล้วลองใหม่'; msg.className = 'msg err';
        } else {
          msg.textContent = 'เชื่อมต่อไม่สำเร็จ (สถานะ ' + res.status + ')'; msg.className = 'msg err';
        }
      } catch (e) {
        msg.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'; msg.className = 'msg err';
      } finally {
        connectBtn.disabled = false;
      }
    }

    connectBtn.addEventListener('click', connect);
  </script>
</body>
</html>
